name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/ui/package-lock.json

      # apps/gui embeds the built frontend via tauri::generate_context!()
      # (frontendDist = "ui/dist"), so it will not compile without it.
      - name: Build frontend (required by apps/gui)
        working-directory: apps/gui/ui
        run: |
          npm ci
          npm run build

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gui/ui/package-lock.json

      - name: Install dependencies
        working-directory: apps/gui/ui
        run: npm ci

      - name: Svelte check
        working-directory: apps/gui/ui
        run: npm run check

      - name: Build
        working-directory: apps/gui/ui
        run: npm run build
