# Curated fan presets for high-thermal-mass custom water loops (several
# large radiators, shared CPU+GPU cooling) — the build this app grew up on.
#
# Design rules (2026-11, after measuring a real session):
# - Idle is flat and low. A loop with big radiators buffers short bursts;
#   spinning fans up for a 5-second CPU spike moves no heat, only noise.
# - Curves climb steeply where the coolant actually warms (65 °C+ on the
#   CPU mix), not from 45 °C.
# - Power anticipation (`power_feed_forward`, °C per 100 W of CPU+GPU power
#   above its one-minute average) starts fans before the coolant lags
#   catch up, and decays on its own.
# - Case air is a separate job: `case_airflow` follows the motherboard
#   sensor so memory and chipset are cooled even when the GPU block keeps
#   the GPU at 35 °C.
#
# Ship as an asset (not hardcoded constants) so the owner can retune a
# preset by editing this file and rebuilding — no Rust edit per tweak.
# Embedded into the binary at compile time via include_str!, so there
# is no runtime disk read or "asset missing" failure mode.
#
# --- Seven presets ------------------------------------------------------
#   silent         — quiet default (legacy id, v0.2 back-compat)
#   balanced       — daily driver (legacy id)
#   gaming         — GPU-weighted, anticipates power spikes
#   performance    — aggressive sustained cooling (legacy id)
#   benchmark      — max cooling, loud by design
#   water_priority — targets coolant temperature (needs the inline sensor)
#   case_airflow   — for exhaust/case fans: follows motherboard temperature
#
# --- Legend ---------------------------------------------------------
# cpu_weight / gpu_weight / water_weight / board_weight
#                          : sensor fusion weights; the sum need not be 1.0
#                            (normalised downstream). Sensors that are not
#                            available on the machine are dropped.
# hysteresis               : °C deadband around current temp — values
#                            inside this band don't re-trigger a target
#                            update. Larger = quieter.
# ramp_up / ramp_down      : %/sec. ramp_down is usually smaller so the
#                            fall-off is gentle to the ear.
# power_feed_forward       : °C per 100 W of CPU+GPU power above its 60 s
#                            average, added to the curve input; 0/absent = off.
# --------------------------------------------------------------------

# Quiet default. Inaudible at idle and through light workloads; the
# loop's thermal mass absorbs short bursts. Slightly CPU-biased because
# idle load comes from CPU cores, not the GPU.
[[preset]]
id = "silent"
name = "Silent"
description = "Quiet default — relies on radiator thermal mass"
hysteresis = 5.0
ramp_up = 3.0
ramp_down = 1.5
cpu_weight = 0.6
gpu_weight = 0.4
water_weight = 0.0
power_feed_forward = 2.0
points = [
    { temp = 30.0, duty = 20.0 },
    { temp = 50.0, duty = 30.0 },
    { temp = 65.0, duty = 50.0 },
    { temp = 80.0, duty = 80.0 },
    { temp = 90.0, duty = 100.0 },
]

# Daily driver. Flat to 50 °C so desktop load stays quiet, then climbs
# where coolant actually warms. Equal CPU/GPU weight: in this class of
# loop the GPU is cold at idle and the hot part in games, so neither
# sensor should dominate the mix. Legacy v0.2 id, retuned 2026-11.
[[preset]]
id = "balanced"
name = "Balanced"
description = "Daily driver — quiet at idle, cool under load"
hysteresis = 4.0
ramp_up = 4.0
ramp_down = 2.0
cpu_weight = 0.5
gpu_weight = 0.5
water_weight = 0.0
power_feed_forward = 4.0
points = [
    { temp = 30.0, duty = 22.0 },
    { temp = 50.0, duty = 32.0 },
    { temp = 65.0, duty = 55.0 },
    { temp = 78.0, duty = 85.0 },
    { temp = 88.0, duty = 100.0 },
]

# Gaming. GPU-weighted because the GPU drives loop temperature in most
# games while the CPU has headroom. Strong power anticipation so fans
# are already moving when a loading screen turns into an open world.
[[preset]]
id = "gaming"
name = "Gaming"
description = "GPU-weighted, ramps early on power spikes"
hysteresis = 3.0
ramp_up = 6.0
ramp_down = 3.0
cpu_weight = 0.4
gpu_weight = 0.6
water_weight = 0.0
power_feed_forward = 6.0
points = [
    { temp = 30.0, duty = 25.0 },
    { temp = 50.0, duty = 40.0 },
    { temp = 62.0, duty = 60.0 },
    { temp = 72.0, duty = 85.0 },
    { temp = 80.0, duty = 100.0 },
]

# Aggressive sustained cooling — all-core renders, long compiles, stress
# runs where temperature matters more than noise. Legacy v0.2 id.
[[preset]]
id = "performance"
name = "Performance"
description = "Aggressive sustained — keeps temps low for hours"
hysteresis = 2.0
ramp_up = 10.0
ramp_down = 5.0
cpu_weight = 0.5
gpu_weight = 0.5
water_weight = 0.0
power_feed_forward = 6.0
points = [
    { temp = 30.0, duty = 30.0 },
    { temp = 40.0, duty = 50.0 },
    { temp = 55.0, duty = 70.0 },
    { temp = 70.0, duty = 90.0 },
    { temp = 80.0, duty = 100.0 },
]

# Benchmark / stress. Starts at 50 % even at idle so fans are already
# moving when the run begins — no spin-up lag on scores. Loud by design.
[[preset]]
id = "benchmark"
name = "Benchmark / Stress"
description = "Cinebench, 3DMark, OCCT — max cooling, loud by design"
hysteresis = 1.0
ramp_up = 12.0
ramp_down = 6.0
cpu_weight = 0.5
gpu_weight = 0.5
water_weight = 0.0
power_feed_forward = 8.0
points = [
    { temp = 30.0, duty = 50.0 },
    { temp = 45.0, duty = 70.0 },
    { temp = 55.0, duty = 85.0 },
    { temp = 65.0, duty = 95.0 },
    { temp = 72.0, duty = 100.0 },
]

# Coolant temperature is the right control variable for a custom loop
# (28–45 °C range). Needs an inline sensor on a motherboard thermistor
# header (`water_inline`); without it, apply_preset falls back to the
# CPU 0.6 / GPU 0.4 split below.
[[preset]]
id = "water_priority"
name = "Water Priority"
description = "Targets coolant temperature — the right control variable for a custom loop; falls back to CPU/GPU without a coolant sensor"
hysteresis = 2.0
ramp_up = 6.0
ramp_down = 3.0
cpu_weight = 0.6
gpu_weight = 0.4
water_weight = 1.0
power_feed_forward = 3.0
points = [
    { temp = 28.0, duty = 30.0 },
    { temp = 34.0, duty = 55.0 },
    { temp = 40.0, duty = 80.0 },
    { temp = 45.0, duty = 100.0 },
]

# Case airflow — for exhaust / case fans that are not on a radiator.
# Follows the motherboard's own sensor (`board_system`) so memory, VRM and
# chipset get air even while the water blocks keep CPU and GPU cool.
# Without a board sensor, apply_preset falls back to CPU/GPU.
[[preset]]
id = "case_airflow"
name = "Case airflow"
description = "For exhaust fans: follows motherboard temperature, keeps memory and chipset cool"
hysteresis = 2.0
ramp_up = 4.0
ramp_down = 2.0
cpu_weight = 0.0
gpu_weight = 0.0
water_weight = 0.0
board_weight = 1.0
power_feed_forward = 0.0
points = [
    { temp = 35.0, duty = 30.0 },
    { temp = 45.0, duty = 45.0 },
    { temp = 55.0, duty = 65.0 },
    { temp = 65.0, duty = 100.0 },
]
